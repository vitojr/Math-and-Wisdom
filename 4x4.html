//document.getElementById("det").value = out; return;} 
function left(e1, n) {return e1.substring(0, n);} // End of left
function right(e1, n) {return e1.substring(e1.length-n);} // End of right
//function instr(n, e1, sB) {e1=right(e1,e1.length-n+1); tmp=e1.indexOf(sB);}

function clean(m) //i = m.indexOf(string) ~ i = instr(1, m, string)
{m = m.replaceAll(",  0i", ""); m = m.replaceAll("+-", "-");
//i=instr(1, m, ",  0i"); if(i>0){m = left(m, i-1);}
if(Math.abs(m)<1e-11){m = "0";}; 
i = m.indexOf("0z"); if(i>0){m = left(m, i-2) + right(m, m.length-i-1);}
//i=instr(1, m, "0z"); if(i>0){m = left(m, i-2) + right(m, m.length-i-1);}
i = m.indexOf("0000000000"); if(i>0){m = left(m, i-1);
//i=instr(1, m, "0000000000"); if(i>0){m = left(m, i-1);
i=right(m, 1); if(i=="."){m = left(m, m.length-1);} }
i = m.indexOf("9999999999"); if(i>0){m = left(m, i-1);
//i=instr(1, m, "9999999999"); if(i>0){m = left(m, i-1);
if(right(m, 1)=="."){m = left(m, m.length-1);} 
var tmp = parseInt(right(m, 1)); tmp = tmp + 1; m = left(m, m.length-1) + tmp.toString();}
return m;}
